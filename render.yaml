services:
  - type: web
    name: roadtrip-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: OPENROUTE_API_KEY
        sync: false
    # Persistent disk configuration - ALL data stored here
    # Includes: SQLite database, sessions, and uploaded photos
    disk:
      name: roadtrip-data
      mountPath: /var/data
      sizeGB: 5
